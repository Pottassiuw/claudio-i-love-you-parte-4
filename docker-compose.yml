# MySQL opcional via Docker. Lê DB_NAME, DB_PASSWORD e DB_PORT do arquivo .env
services:
  mysql:
    image: mysql:8.0
    container_name: treinos-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      retries: 20

volumes:
  mysql_data:
